databaseChangeLog:
  - changeSet:
      id: 0009-create-incomes-table
      author: backend-financeiro
      changes:
        - createTable:
            tableName: incomes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_incomes
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: income_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: receipt_method
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: VARCHAR(500)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(180)
              - column:
                  name: updated_by
                  type: VARCHAR(180)

  - changeSet:
      id: 0009-create-incomes-table-fk-user
      author: backend-financeiro
      changes:
        - addForeignKeyConstraint:
            baseTableName: incomes
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_incomes_user
            onDelete: RESTRICT

  - changeSet:
      id: 0009-create-incomes-table-fk-category
      author: backend-financeiro
      changes:
        - addForeignKeyConstraint:
            baseTableName: incomes
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_incomes_category
            onDelete: RESTRICT

  - changeSet:
      id: 0009-create-incomes-table-check-amount
      author: backend-financeiro
      changes:
        - sql:
            sql: ALTER TABLE incomes ADD CONSTRAINT ck_incomes_amount_positive CHECK (amount > 0);
      rollback:
        - sql:
            sql: ALTER TABLE incomes DROP CONSTRAINT ck_incomes_amount_positive;

  - changeSet:
      id: 0009-create-incomes-table-index-user-date
      author: backend-financeiro
      changes:
        - createIndex:
            tableName: incomes
            indexName: idx_incomes_user_date
            columns:
              - column:
                  name: user_id
              - column:
                  name: income_date

  - changeSet:
      id: 0009-create-incomes-table-index-category
      author: backend-financeiro
      changes:
        - createIndex:
            tableName: incomes
            indexName: idx_incomes_category
            columns:
              - column:
                  name: category_id

  - changeSet:
      id: 0009-create-incomes-table-index-receipt-method
      author: backend-financeiro
      changes:
        - createIndex:
            tableName: incomes
            indexName: idx_incomes_receipt_method
            columns:
              - column:
                  name: receipt_method
