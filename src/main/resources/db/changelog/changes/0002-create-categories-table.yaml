databaseChangeLog:
  - changeSet:
      id: 0002-create-categories-table
      author: backend-financeiro
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categories
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: color
                  type: VARCHAR(7)
                  constraints:
                    nullable: false
              - column:
                  name: icon
                  type: VARCHAR(50)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(180)
              - column:
                  name: updated_by
                  type: VARCHAR(180)

  - changeSet:
      id: 0002-create-categories-table-fk-user
      author: backend-financeiro
      changes:
        - addForeignKeyConstraint:
            baseTableName: categories
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_categories_user
            onDelete: RESTRICT

  - changeSet:
      id: 0002-create-categories-table-unique-user-name
      author: backend-financeiro
      changes:
        - addUniqueConstraint:
            tableName: categories
            columnNames: user_id, name
            constraintName: uk_categories_user_name

  - changeSet:
      id: 0002-create-categories-table-index-user
      author: backend-financeiro
      changes:
        - createIndex:
            tableName: categories
            indexName: idx_categories_user
            columns:
              - column:
                  name: user_id
