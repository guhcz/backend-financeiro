# Application
spring.application.name=backend-financeiro
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA
# ddl-auto=validate: schema is owned by Liquibase, Hibernate only checks entities match it.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JWT (app.jwt.* bound to security.JwtProperties)
# No default for app.jwt.secret: app fails fast at startup if it's not set via env var.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

# CORS (app.cors.* bound to config.CorsProperties)
# Default covers any localhost port for local dev (frontend dev servers/sandboxes often
# use a random port). Production must override CORS_ALLOWED_ORIGINS with the real domain.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# Recurring expenses (app.recurring-expense.*)
app.recurring-expense.generation-cron=${RECURRING_EXPENSE_CRON:0 0 1 * * *}
app.recurring-expense.scheduler-enabled=${RECURRING_EXPENSE_SCHEDULER_ENABLED:true}

# Recurring incomes (app.recurring-income.*)
app.recurring-income.generation-cron=${RECURRING_INCOME_CRON:0 0 1 * * *}
app.recurring-income.scheduler-enabled=${RECURRING_INCOME_SCHEDULER_ENABLED:true}

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
