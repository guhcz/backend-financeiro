# Production datasource: no defaults, all values must come from the environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hikari: recycle connections before the managed DB's idle timeout closes them
# under us, which otherwise surfaces as "connection has been closed" from the
# keepalive task.
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.show-sql=false

logging.level.com.personal.backend_financeiro=INFO
